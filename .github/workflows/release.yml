name: Build & Release APK

# 打 tag（v 开头，如 v2.3.0）推送时自动构建并发布 Release；也可在 Actions 页手动触发。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # 发布 Release 需要写权限

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 若在仓库 Secrets 里配置了 KEYSTORE_BASE64，则解码出 keystore 并导出路径；
      # 未配置则跳过，release 退回 debug 签名。
      - name: Decode keystore (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using release keystore from secrets."
          else
            echo "No KEYSTORE_BASE64 secret; release will be debug-signed."
          fi

      - name: Build github release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleGithubRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/github/release/*.apk "out/Virtual-Hosts-${GITHUB_REF_NAME}.apk"
          ls -la out

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Virtual-Hosts-${{ github.ref_name }}
          path: out/*.apk

      # 仅在 push tag 时发布 Release（手动触发只产出 artifact）
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
